<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjualan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

<!-- Tabs -->
<ul class="nav bg-dark">
    <li class="nav-item">
        <a class="nav-link px-4 py-2 bg-primary text-light border-radius: 0;" href="#">Penjualan</a>
    </li>
    <li class="nav-item">
        <a class="nav-link px-4 py-2 bg-dark text-light" href="#">Pembelian</a>
    </li>
</ul>

<div class="container mt-3">

    <!-- Header Form -->
    <div class="mb-3">
        <div class="d-flex align-items-center mb-2">
            <label class="me-2" style="width:90px;">Tanggal:</label>
            <input type="date" class="form-control" style="width:200px;" id="tanggal">
        </div>
        <div class="d-flex align-items-center mb-2">
            <label class="me-2" style="width:90px;">Konsumen:</label>
            <input type="text" class="form-control" style="width:200px;" id="konsumen">
        </div>
        <div class="d-flex align-items-center mb-2">
            <label class="me-2" style="width:90px;">No. Telp:</label>
            <input type="text" class="form-control" style="width:200px;" id="notelp">
        </div>
        <div class="d-flex align-items-start mb-2">
            <label class="me-2" style="width:90px;">Keterangan:</label>
            <textarea class="form-control" style="width:200px;" id="keterangan" rows="4"></textarea>
        </div>
    </div>

    <!-- Item Input Row -->
    <div class="d-flex align-items-end gap-2 mb-3 flex-wrap">
        <div>
            <label class="form-label mb-1">Kode</label>
            <input type="text" class="form-control" style="width:110px;" id="kode">
        </div>
        <div>
            <label class="form-label mb-1">Nama</label>
            <input type="text" class="form-control" style="width:180px;" id="nama">
        </div>
        <div>
            <label class="form-label mb-1">Satuan</label>
            <input type="text" class="form-control" style="width:110px;" id="satuan">
        </div>
        <div>
            <label class="form-label mb-1">Harga</label>
            <input type="number" class="form-control" style="width:120px;" id="harga">
        </div>
        <div>
            <label class="form-label mb-1">Qty</label>
            <input type="number" class="form-control" style="width:70px;" id="qty" min="1" value="1">
        </div>
        <button id="tambah" class="btn btn-primary">Tambah</button>
    </div>

    <!-- Table -->
    <table class="table table-bordered" id="tbldata">
        <thead class="table-light">
            <tr>
                <th>Action</th>
                <th>Kode</th>
                <th>Nama</th>
                <th>Satuan</th>
                <th>Harga</th>
                <th>Qty</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot class="table-light">
            <tr>
                <td colspan="4"></td>
                <td colspan="2"><strong>Total</strong></td>
                <td id="tot">0</td>
            </tr>
            <tr>
                <td colspan="4"></td>
                <td colspan="2"><strong>Diskon</strong></td>
                <td><input type="number" class="form-control form-control-sm" id="diskon" value="0"></td>
            </tr>
            <tr>
                <td colspan="4"></td>
                <td colspan="2"><strong>Grandtotal</strong></td>
                <td id="grandtotal">0</td>
            </tr>
            <tr>
                <td colspan="4"></td>
                <td colspan="2"><strong>Bayar</strong></td>
                <td><input type="number" class="form-control form-control-sm" id="bayar" value="0"></td>
            </tr>
        </tfoot>
    </table>

</div>

<script>
    function hitungtotal() {
        let total = 0;
        $("#tbldata tbody tr").each(function () {
            let subtotal = parseFloat($(this).find("td").eq(6).text()) || 0;
            total += subtotal;
        });
        $("#tot").text(total);

        let diskon = parseFloat($("#diskon").val()) || 0;
        let grandtotal = total - diskon;
        if (grandtotal < 0) grandtotal = 0;
        $("#grandtotal").text(grandtotal);
    }

    $(document).ready(function () {

        $("#tambah").click(function () {
            let kode   = $("#kode").val().trim();
            let nama   = $("#nama").val().trim();
            let satuan = $("#satuan").val().trim();
            let harga  = parseFloat($("#harga").val()) || 0;
            let qty    = parseInt($("#qty").val()) || 1;

            if (kode === "" || nama === "" || satuan === "" || harga === 0) {
                alert("Lengkapi data item terlebih dahulu!");
                return;
            }

            let subtotal = harga * qty;
            let row = "<tr>" +
                "<td><button class='btn btn-danger btn-sm hapus'>X</button></td>" +
                "<td>" + kode + "</td>" +
                "<td>" + nama + "</td>" +
                "<td>" + satuan + "</td>" +
                "<td>" + harga + "</td>" +
                "<td>" + qty + "</td>" +
                "<td>" + subtotal + "</td>" +
                "</tr>";

            $("#tbldata tbody").append(row);
            hitungtotal();

            $("#kode").val("");
            $("#nama").val("");
            $("#satuan").val("");
            $("#harga").val("");
            $("#qty").val("1");
        });

        $("#tbldata").on("click", ".hapus", function () {
            $(this).closest("tr").remove();
            hitungtotal();
        });

        $("#diskon").on("input", function () {
            hitungtotal();
        });

    });
</script>
</body>
</html>
