<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjualan</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; font-size: 14px; }
        body { background: #fff; }

        /* Tabs */
        .tabs { display: flex; background-color: #1a1a2e; }
        .tabs a { display: inline-block; padding: 10px 20px; color: white; text-decoration: none; }
        .tabs a.active { background-color: #0d6efd; }

        /* Container */
        .container { padding: 16px; }

        /* Header form */
        .header-form { margin-bottom: 16px; }
        .form-row { display: flex; align-items: center; margin-bottom: 8px; }
        .form-row label { width: 90px; flex-shrink: 0; }
        .form-row input, .form-row textarea { padding: 5px 8px; border: 1px solid #ced4da; border-radius: 4px; width: 220px; }
        .form-row textarea { resize: vertical; height: 80px; vertical-align: top; }

        /* Item input row */
        .input-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { margin-bottom: 4px; }
        .input-group input { padding: 5px 8px; border: 1px solid #ced4da; border-radius: 4px; }
        #kode   { width: 110px; }
        #nama   { width: 180px; }
        #satuan { width: 110px; }
        #harga  { width: 120px; }
        #qty    { width: 70px; }

        /* Buttons */
        .btn-tambah { padding: 6px 16px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-tambah:hover { background-color: #0b5ed7; }
        .btn-hapus { padding: 4px 10px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-hapus:hover { background-color: #b02a37; }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        table th, table td { border: 1px solid #dee2e6; padding: 7px 10px; text-align: left; }
        table thead { background-color: #f8f9fa; }
        tfoot td { background-color: #f8f9fa; }
        tfoot input { padding: 4px 6px; border: 1px solid #ced4da; border-radius: 4px; width: 100%; }
    </style>
</head>
<body>

<!-- Tabs -->
<div class="tabs">
    <a class="active" href="#">Penjualan</a>
    <a href="#">Pembelian</a>
</div>

<div class="container">

    <!-- Header Form -->
    <div class="header-form">
        <div class="form-row">
            <label>Tanggal:</label>
            <input type="date" id="tanggal">
        </div>
        <div class="form-row">
            <label>Konsumen:</label>
            <input type="text" id="konsumen">
        </div>
        <div class="form-row">
            <label>No. Telp:</label>
            <input type="text" id="notelp">
        </div>
        <div class="form-row">
            <label>Keterangan:</label>
            <textarea id="keterangan"></textarea>
        </div>
    </div>

    <!-- Item Input Row -->
    <div class="input-row">
        <div class="input-group">
            <label>Kode</label>
            <input type="text" id="kode">
        </div>
        <div class="input-group">
            <label>Nama</label>
            <input type="text" id="nama">
        </div>
        <div class="input-group">
            <label>Satuan</label>
            <input type="text" id="satuan">
        </div>
        <div class="input-group">
            <label>Harga</label>
            <input type="number" id="harga">
        </div>
        <div class="input-group">
            <label>Qty</label>
            <input type="number" id="qty" min="1" value="1">
        </div>
        <button id="tambah" class="btn-tambah">Tambah</button>
    </div>

    <!-- Table -->
    <table id="tbldata">
        <thead>
            <tr>
                <th>Action</th>
                <th>Kode</th>
                <th>Nama</th>
                <th>Satuan</th>
                <th>Harga</th>
                <th>Qty</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr>
                <td colspan="4"></td>
                <td colspan="2"><strong>Total</strong></td>
                <td id="tot">0</td>
            </tr>
            <tr>
                <td colspan="4"></td>
                <td colspan="2"><strong>Diskon</strong></td>
                <td><input type="number" id="diskon" value="0"></td>
            </tr>
            <tr>
                <td colspan="4"></td>
                <td colspan="2"><strong>Grandtotal</strong></td>
                <td id="grandtotal">0</td>
            </tr>
            <tr>
                <td colspan="4"></td>
                <td colspan="2"><strong>Bayar</strong></td>
                <td><input type="number" id="bayar" value="0"></td>
            </tr>
        </tfoot>
    </table>

</div>

<script>
    function hitungtotal() {
        let total = 0;
        $("#tbldata tbody tr").each(function () {
            let subtotal = parseFloat($(this).find("td").eq(6).text()) || 0;
            total += subtotal;
        });
        $("#tot").text(total);

        let diskon = parseFloat($("#diskon").val()) || 0;
        let grandtotal = total - diskon;
        if (grandtotal < 0) grandtotal = 0;
        $("#grandtotal").text(grandtotal);
    }

    $(document).ready(function () {

        $("#tambah").click(function () {
            let kode   = $("#kode").val().trim();
            let nama   = $("#nama").val().trim();
            let satuan = $("#satuan").val().trim();
            let harga  = parseFloat($("#harga").val()) || 0;
            let qty    = parseInt($("#qty").val()) || 1;

            if (kode === "" || nama === "" || satuan === "" || harga === 0) {
                alert("Lengkapi data item terlebih dahulu!");
                return;
            }

            let subtotal = harga * qty;
            let row = "<tr>" +
                "<td><button class='btn-hapus hapus'>X</button></td>" +
                "<td>" + kode + "</td>" +
                "<td>" + nama + "</td>" +
                "<td>" + satuan + "</td>" +
                "<td>" + harga + "</td>" +
                "<td>" + qty + "</td>" +
                "<td>" + subtotal + "</td>" +
                "</tr>";

            $("#tbldata tbody").append(row);
            hitungtotal();

            $("#kode").val("");
            $("#nama").val("");
            $("#satuan").val("");
            $("#harga").val("");
            $("#qty").val("1");
        });

        $("#tbldata").on("click", ".hapus", function () {
            $(this).closest("tr").remove();
            hitungtotal();
        });

        $("#diskon").on("input", function () {
            hitungtotal();
        });

    });
</script>
</body>
</html>
