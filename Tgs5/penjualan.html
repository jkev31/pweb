<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjualan Navbar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

    <!-- Tabs -->
    <ul class="nav bg-dark">
        <li class="nav-item">
            <a class="nav-link px-4 py-2 bg-primary text-light" href="#">Penjualan</a>
        </li>
        <li class="nav-item">
            <a class="nav-link px-4 py-2 bg-dark text-light" href="#">Pembelian</a>
        </li>
    </ul>

    <div class="container mt-3">

        <!-- Header -->
        <div class="mb-3">
            <div class="d-flex align-items-center mb-2">
                <label class="col-sm-1 col-form-label">Tanggal:</label>
                <div class="col-sm-3"> 
                    <input type="date" class="form-control" id="tanggal"> 
                </div>
            </div>
            <div class="d-flex align-items-center mb-2">
                <label class="col-sm-1 col-form-label">Konsumen:</label>
                <div class="col-sm-3"> 
                    <input type="text" class="form-control" id="konsumen">
                </div>
            </div>
            <div class="d-flex align-items-center mb-2">
                <label class="col-sm-1 col-form-label">No. Telp:</label>
                <div class="col-sm-3"> 
                    <input type="text" class="form-control" id="notelp">
                </div>
            </div>
            <div class="d-flex align-items-start mb-2">
                <label class="col-sm-1 col-form-label">Keterangan:</label>
                <div class="col-sm-3"> 
                    <textarea class="form-control" id="keterangan"></textarea>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="d-flex gap-2 mb-3 flex-wrap">
            <input type="text" class="form-control w-auto" id="kode" placeholder="Kode" readonly>
            <input type="text" class="form-control w-auto" id="nama" placeholder="Nama" readonly>
            <input type="text" class="form-control w-auto" id="satuan" placeholder="Satuan" readonly>
            <input type="number" class="form-control w-auto" id="harga" placeholder="Harga" readonly>
            <button id="tambah" class="btn btn-primary col-sm-1">Tambah</button>
        </div>

        <!-- Table -->
        <table class="table table-bordered" id="tbldata">
            <thead>
                <tr>
                    <th>Action</th>
                    <th>Kode</th>
                    <th>Nama</th>
                    <th>Satuan</th>
                    <th>Harga</th>
                    <th>Qty</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <td colspan="5"></td>
                    <td>Total</td>
                    <td id="tot">0</td>
                </tr>
                <tr>
                    <td colspan="5"></td>
                    <td>Diskon</td>
                    <td><input type="number" id="diskon" class="form-control" readonly></td>
                </tr>
                <tr>
                    <td colspan="5"></td>
                    <td>Grandtotal</td>
                    <td id="grandtotal">0</td>
                </tr>
            </tfoot>
        </table>

    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalItem">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Pilih Item</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Kode</th>
                                <th>Nama</th>
                                <th>Harga</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="listItem"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>

        // DATA ITEM
        let items = [
            { kode: "Item1", nama: "Pensil", satuan: "PCS", harga: 2000 },
            { kode: "Item2", nama: "Buku", satuan: "PCS", harga: 5000 },
            { kode: "Item3", nama: "Penghapus", satuan: "PCS", harga: 1500 },
            { kode: "Item4", nama: "Pulpen", satuan: "PCS", harga: 3000 }
        ];

        function hitungtotal() {
            let total = 0;

            $("#tbldata tbody tr").each(function () {
                let harga = parseFloat($(this).find(".harga").text()) || 0;
                let qty = parseInt($(this).find(".qty").val()) || 1;

                let subtotal = harga * qty;
                $(this).find(".subtotal").text(subtotal);

                total += subtotal;
            });

            $("#tot").text(total);

            let diskon = 0;
            if (total >= 100000) {
                diskon = total * 0.5;
            }

            $("#diskon").val(diskon);

            let grandtotal = total - diskon;
            $("#grandtotal").text(grandtotal);
        }

        $(document).ready(function () {

            // BUKA MODAL
            $("#kode").click(function () {
                let html = "";

                items.forEach(item => {
                    html += `<tr>
                        <td>${item.kode}</td>
                        <td>${item.nama}</td>
                        <td>${item.harga}</td>
                        <td>
                            <button class="btn btn-success pilih"
                                data-kode="${item.kode}"
                                data-nama="${item.nama}"
                                data-satuan="${item.satuan}"
                                data-harga="${item.harga}">
                                Pilih
                            </button>
                        </td>
                    </tr>`;
                });

                $("#listItem").html(html);
                new bootstrap.Modal(document.getElementById('modalItem')).show();
            });

            // PILIH ITEM
            $("#listItem").on("click", ".pilih", function () {
                $("#kode").val($(this).data("kode"));
                $("#nama").val($(this).data("nama"));
                $("#satuan").val($(this).data("satuan"));
                $("#harga").val($(this).data("harga"));

                $("#modalItem").modal("hide");
            });

            // TAMBAH KE TABEL
            $("#tambah").click(function () {
                let kode = $("#kode").val();
                let nama = $("#nama").val();
                let satuan = $("#satuan").val();
                let harga = parseFloat($("#harga").val()) || 0;

                if (kode === "") {
                    alert("Pilih item dulu!");
                    return;
                }

                let row = `<tr>
                    <td><button class="btn btn-danger hapus">X</button></td>
                    <td>${kode}</td>
                    <td>${nama}</td>
                    <td>${satuan}</td>
                    <td class="harga">${harga}</td>
                    <td><input type="number" class="form-control qty" value="1" min="1"></td>
                    <td class="subtotal">${harga}</td>
                </tr>`;

                $("#tbldata tbody").append(row);
                hitungtotal();

                // reset input
                $("#kode, #nama, #satuan, #harga").val("");
            });

            // HAPUS
            $("#tbldata").on("click", ".hapus", function () {
                $(this).closest("tr").remove();
                hitungtotal();
            });

            // UPDATE QTY
            $("#tbldata").on("input", ".qty", function () {
                hitungtotal();
            });

        });

    </script>

</body>
</html>
