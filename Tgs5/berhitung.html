<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi Table di Kelas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center align-items-center py-4">

  <h6 class="text-secondary align-self-start ms-3 mb-2 align-items-center">materi table di kelas</h6>

  <div class="card shadow-sm w-75">
    <div class="card-body">

      <h5 class="card-title fw-bold mb-4">Berhitung</h5>

      <div class="row g-2 align-items-end mb-4">
        <div class="col-md-3">
          <label for="inputKode" class="form-label small">kode</label>
          <input type="text" id="inputKode" class="form-control form-control-sm">
        </div>
        <div class="col-md-3">
          <label for="inputNama" class="form-label small">nama</label>
          <input type="text" id="inputNama" class="form-control form-control-sm">
        </div>
        <div class="col-md-3">
          <label for="inputHarga" class="form-label small">harga</label>
          <input type="text" id="inputHarga" class="form-control form-control-sm">
        </div>
        <div class="col-md-3">
          <button id="btnTambah" class="btn btn-primary btn-sm w-100">tambah</button>
        </div>
      </div>

      <table class="table table-bordered table-sm">
        <thead>
          <tr>
            <th>Action</th>
            <th class="text-center">kode</th>
            <th class="text-center">nama</th>
            <th class="text-center">harga</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let rowCount = 0;

    $('#btnTambah').on('click', function () {
      const kode  = $('#inputKode').val().trim();
      const nama  = $('#inputNama').val().trim();
      const harga = $('#inputHarga').val().trim();

      if (kode === '' || nama === '' || harga === '') {
        alert('Semua field harus diisi!');
        return;
      }

      rowCount++;
      const rowId = 'row-' + rowCount;

      const newRow = `
        <tr id="${rowId}">
          <td>
            <button class="btn btn-warning btn-sm me-1 btn-edit" data-id="${rowId}">Edit</button>
            <button class="btn btn-danger btn-sm btn-hapus" data-id="${rowId}">Hapus</button>
          </td>
          <td class="text-center kode">${kode}</td>
          <td class="text-center nama">${nama}</td>
          <td class="text-center harga">${harga}</td>
        </tr>`;

      $('#tableBody').append(newRow);

      $('#inputKode').val('');
      $('#inputNama').val('');
      $('#inputHarga').val('');
      $('#inputKode').focus();
    });

    $(document).on('click', '.btn-hapus', function () {
      const id = $(this).data('id');
      $('#' + id).remove();
    });

    $(document).on('click', '.btn-edit', function () {
      const id    = $(this).data('id');
      const row   = $('#' + id);

      $('#inputKode').val(row.find('.kode').text());
      $('#inputNama').val(row.find('.nama').text());
      $('#inputHarga').val(row.find('.harga').text());

      row.remove();
      $('#inputKode').focus();
    });
  </script>
</body>
</html>
