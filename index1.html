<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Links</title>
</head>

<body>
    <h1>Kalkulator Sederhana</h1>
    <p id="output"></p>
    <label>angka 1</label>
    <input type="text" id="angka1"><br><br>
    <label>angka 2</label>
    <input type="text" id="angka2"><br><br>
    <button onclick="tambah()">+</button>
    <button onclick="kurang()">-</button>
    <button onclick="kali()">*</button>
    <button onclick="bagi()">/</button>
    
    <script>
        function tambah() {
            let angka1 = document.getElementById("angka1").value;
            let angka2 = document.getElementById("angka2").value;
            let hasil = parseInt(angka1) + parseInt(angka2);
            document.getElementById("output").innerHTML = "Hasil = " + hasil;
        }
        function kurang() {
            let angka1 = document.getElementById("angka1").value;
            let angka2 = document.getElementById("angka2").value;
            let hasil = parseInt(angka1) - parseInt(angka2);
            document.getElementById("output").innerHTML = "Hasil = " + hasil;
        }
        function kali() {
            let angka1 = document.getElementById("angka1").value;
            let angka2 = document.getElementById("angka2").value;
            let hasil = parseInt(angka1) * parseInt(angka2);
            document.getElementById("output").innerHTML = "Hasil = " + hasil;
        }
        function bagi() {
            let angka1 = document.getElementById("angka1").value;
            let angka2 = document.getElementById("angka2").value;
            let hasil = parseInt(angka1) / parseInt(angka2);
            document.getElementById("output").innerHTML = "Hasil = " + hasil;
        }
    </script>
</body>

</html>
