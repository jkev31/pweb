<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Input Types</title>
</head>

<body>

    <h1>Different Input Types</h1>

    <form>

        <label>"Saran Teks"
            <input type="text" placeholder="saran teks">
        </label><br><br>

        <label>Password:
            <input type="password" placeholder="Enter password">
        </label><br><br>

        <label>Email:
            <input type="email" placeholder="Enter email">
        </label><br><br>

        <label>Suhu favorit:
            <input type="number" min="-100" max="100">
        </label><br><br>

        <label>Date:
            <input type="date">
        </label><br><br>

        <label>Color:
            <input type="color">
        </label><br><br>

        <label>Range:
            <input type="range" min="0" max="100" value="50">
        </label><br><br>

        <fieldset>
            <legend>Mhs tergokil:</legend>

            <label>
                <input type="radio" name="favorite" value="farrel"> Farrel
            </label><br>

            <label>
                <input type="radio" name="favorite" value="vian"> Vian
            </label><br>

            <label>
                <input type="radio" name="favorite" value="mike"> Koh Mike
            </label>

        </fieldset>

    </form>

</body>

</html>
