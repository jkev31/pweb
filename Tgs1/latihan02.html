<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Paragraph </title>
</head>

<body>
    <h1>judul</h1>
    <P>aku <strong>PERGI</strong> XD </P>
    <P>aku <em>PERGI</em> XD </P>
    <P>aku <small>PERGI</small> XD </P>
    <P>aku <del>DATANG</del> dan <ins>PERGI</ins> XD </P>
    <P>aku <sub>PERGI</sub> XD </P>
    <P>aku <sup>PERGI</sup> XD </P>
    <blockquote>
        aku PERGI XD
    </blockquote>

</body>

</html>
