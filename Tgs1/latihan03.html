<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Lists </title>
</head>

<body>
    <h1>ini list</h1>
    <h2>Unordered lists</h2>
    <ul>
        <li>list a</li>
        <li>list b</li>
        <li>list c</li>
    </ul>

    <h2>Ordered list</h2>
    <ol>
        <li>list 1</li>
        <li>list 2</li>
        <li>list 3</li>
    </ol>
    <h2>Description Lists</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
    </dl>
</body>

</html>
