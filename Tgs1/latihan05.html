<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Images</title>
</head>

<body>

    <h1>Image biasa</h1>

    <img src="download.jpg" alt="Sample placeholder image" width="300" height="200">

    <h2>Image with Caption</h2>

    <figure>
        <img src="download.jpg" alt="Figure example" width="300" height="200">
        <figcaption>Gambar dunia fiksi open-world</figcaption>
    </figure>

    <h3>Clickable Image</h3>

    <a href="https://www.youtube.com">
        <img src="download.jpg" alt="Clickable image" width="300" height="200">
        <figcaption>Gambar ini menuju ke Youtube</figcaption>
    </a>

</body>

</html>
