<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Tables</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #000000;
            padding: 8px;
            text-align: left;
            background-color: rgb(126, 156, 255);
        }

        th {
            background-color: #002f94;
        }
    </style>

</head>

<body>

    <h1 style="text-align: center;">Student Grades Table</h1>

    <table>

        <thead>
            <tr style="color: white;">
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr style="color: white;">
                <td>Farrel</td>
                <td>Matbis</td>
                <td>95</td>
                <td>Gokil! ^^</td>
            </tr>

            <tr style="color: white;">
                <td>Vian</td>
                <td>UI/UX</td>
                <td>67</td>
                <td>Lucu XD</td>
            </tr>

        </tbody>

    </table>

</body>

</html>
