<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
  <div class="container">
    <h3>Berhitung</h3>
    <div class="row mb-3 mt-3">
      <div class="col-sm-3">
        <label>kode</label> <input type="text" class="form-control" id="kode" data-bs-toggle="modal"
          data-bs-target="#masteritem" readonly>
      </div>
      <div class="col-sm-3">
        <label>nama</label> <input type="text" class="form-control" id="nama" readonly>
      </div>
      <div class="col-sm-3">
        <label>harga</label> <input type="number" class="form-control" id="harga" readonly>
      </div>
      <div class="col-sm-3">
        <button id="tambah" class="btn btn-primary">tambah</button>
      </div>
    </div>





    <table class="table table-bordered" id="tbldata">
      <theader>
        <tr>
          <th>Action</th>
          <th>kode</th>
          <th>nama</th>
          <th>harga</th>
        </tr>
      </theader>
      <tbody>

      </tbody>
      <tfoot>
        <tr>
          <td colspan="3">Total</td>
          <td id="tot">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- The Modal -->
  <div class="modal" id="masteritem">
    <div class="modal-dialog">
      <div class="modal-content">

        <!-- Modal Header -->
        <div class="modal-header">
          <h4 class="modal-title">Master Item</h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <!-- Modal body -->
        <div class="modal-body">
          <table class="table">
            <thead>
              <th>Pilih</th>
              <th>kode</th>
              <th>Nama</th>
              <th>Harga</th>
            </thead>
            <tbody>
              <tr>
                <td><button class="btn btn-success" data-bs-dismiss="modal"
                    onclick="tambahtabel('m001','produk 01', '59000')">pilih</button></td>
                <td>m001</td>
                <td>produk 01</td>
                <td>59000</td>
              </tr>
              <tr>
                <td><button class="btn btn-success" data-bs-dismiss="modal"
                    onclick="tambahtabel('m002','produk 02', '19000')">pilih</button></td>
                <td>m002</td>
                <td>produk 02</td>
                <td>19000</td>
              </tr>
              <tr>
                <td><button class="btn btn-success" data-bs-dismiss="modal"
                    onclick="tambahtabel('m003','produk 03', '91000')">pilih</button></td>
                <td>m003</td>
                <td>produk 03</td>
                <td>91000</td>
              </tr>
              <tr>
                <td><button class="btn btn-success" data-bs-dismiss="modal"
                    onclick="tambahtabel('m004','produk 04', '39000')">pilih</button></td>
                <td>m004</td>
                <td>produk 04</td>
                <td>39000</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Modal footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
        </div>

      </div>
    </div>
  </div>


  <script>

    function tambahtabel(kode, nama, harga) {
      $("#kode").val(kode);
      $("#nama").val(nama);
      $("#harga").val(harga);
    }
    function hitungtotal() {
      let total = 0;
      $("#tbldata tr").each(function () {
        let h = $(this).find("td").eq(3).text();
        console.log(h);
        total += parseFloat(h) || 0;
        console.log(total);
      });
      $("#tot").html("<b>" + total + "</b>");
    }

    $(document).ready(function () {

      $("#tambah").click(function () {
        let x = $("#kode").val();
        let y = $("#nama").val();
        let z = $("#harga").val();
        console.log(x);
        console.log(y);
        console.log(z);
        let tbltr = "<tr><td><button class=\"btn btn-danger hapus\">X</button</td><td>" + x + "</td><td>" + y + "</td><td>" + z + "</td><tr>";
        $("#tbldata").append(tbltr);
        hitungtotal();
      });

      $("#tbldata").on("click", ".hapus", function () {
        $(this).closest('tr').remove();
        hitungtotal();
      });



    });
  </script>
</body>

</html>
