<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjualan Navbar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-light" href="#">Simple POS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active bg-primary text-light" aria-current="page" href="#">Penjualan</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="#">Pembelian</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">

        <!-- Header -->
        <div class="mb-3">
            <div class="d-flex align-items-center mb-2">
                <label class="col-sm-1 col-form-label">Tanggal:</label>
                <div class="col-sm-2">
                    <input type="date" class="form-control" id="tanggal">
                </div>
            </div>
            <div class="d-flex align-items-center mb-2">
                <label class="col-sm-1 col-form-label">Konsumen:</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="konsumen">
                </div>
            </div>
            <div class="d-flex align-items-center mb-2">
                <label class="col-sm-1 col-form-label">No. Telp:</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="notelp">
                </div>
            </div>
            <div class="d-flex align-items-start mb-2">
                <label class="col-sm-1 col-form-label">Keterangan:</label>
                <div class="col-sm-2">
                    <textarea class="form-control" id="keterangan"></textarea>
                </div>
            </div>
        </div>

        <!-- Input Row -->
        <div class="d-flex gap-2 mb-3 flex-wrap align-items-center">
            <input type="text" class="form-control w-auto" id="kode" placeholder="Kode" readonly>
            <input type="text" class="form-control w-auto" id="nama" placeholder="Nama" readonly>
            <input type="text" class="form-control w-auto" id="satuan" placeholder="Satuan" readonly>
            <input type="number" class="form-control w-auto" id="harga" placeholder="Harga" readonly>
            <input type="number" class="form-control w-auto" id="qty" placeholder="Qty" min="1" value="">
            <input type="number" class="form-control w-auto bg-body-secondary" id="subtotal_preview" placeholder="Subtotal" readonly>
            <button id="tambah" class="btn btn-primary col-sm-1">Tambah</button>
        </div>

        <!-- Table -->
        <table class="table table-bordered border-dark table-hover table-striped" id="tbldata">
            <thead>
                <tr>
                    <th class="bg-dark text-light">Action</th>
                    <th class="bg-dark text-light">Kode</th>
                    <th class="bg-dark text-light">Nama</th>
                    <th class="bg-dark text-light">Satuan</th>
                    <th class="bg-dark text-light">Harga</th>
                    <th class="bg-dark text-light">Qty</th>
                    <th class="bg-dark text-light">Subtotal</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <td colspan="5"></td>
                    <td>Total</td>
                    <td id="total">0</td>
                </tr>
                <tr>
                    <td colspan="5"></td>
                    <td>
                        Diskon
                        <input type="number" id="diskon_persen" class="form-control form-control-sm mt-1"
                            placeholder="0" min="0" max="100" style="width:70px; display:inline-block;">
                        <span class="text-muted">%</span>
                    </td>
                    <td>
                        <span id="diskon_nominal">0</span>
                    </td>
                </tr>
                <tr>
                    <td colspan="5"></td>
                    <td>Grandtotal</td>
                    <td id="grandtotal">0</td>
                </tr>
                <tr>
                    <td colspan="5"></td>
                    <td>Bayar</td>
                    <td><input type="number" id="bayar" class="form-control"></td>
                </tr>
                <tr>
                    <td colspan="5"></td>
                    <td>Kembali</td>
                    <td id="kembali">0</td>
                </tr>
            </tfoot>
        </table>

    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalItem">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Pilih Item</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Kode</th>
                                <th>Nama</th>
                                <th>Harga</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="listItem"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>

        // DATA ITEM
        let items = [
            { kode: "Item1", nama: "Pensil", satuan: "PCS", harga: 2000 },
            { kode: "Item2", nama: "Buku", satuan: "PCS", harga: 5000 },
            { kode: "Item3", nama: "Penghapus", satuan: "PCS", harga: 1500 },
            { kode: "Item4", nama: "Pulpen", satuan: "PCS", harga: 3000 }
        ];

        function hitungtotal() {
            let total = 0;

            $("#tbldata tbody tr").each(function () {
                let harga    = parseFloat($(this).find(".harga").text()) || 0;
                let qty      = parseInt($(this).find(".qty").text()) || 1;
                let subtotal = harga * qty;
                $(this).find(".subtotal").text("Rp " + subtotal);
                total += subtotal;
            });

            $("#total").text("Rp " + total);

            // Diskon dari input % user
            let persen     = parseFloat($("#diskon_persen").val()) || 0;
            let nominal    = Math.round(total * persen / 100);
            $("#diskon_nominal").text("Rp " + nominal);

            let grandtotal = total - nominal;
            if (grandtotal < 0) grandtotal = 0;
            $("#grandtotal").text("Rp " + grandtotal);

            let bayar    = parseFloat($("#bayar").val()) || 0;
            let kembali  = bayar >= grandtotal ? bayar - grandtotal : 0;
            $("#kembali").text("Rp " + kembali);
        }

        function updateSubtotalPreview() {
            let harga = parseFloat($("#harga").val()) || 0;
            let qty   = parseInt($("#qty").val()) || 0;
            $("#subtotal_preview").val(qty > 0 ? harga * qty : "");
        }

        $(document).ready(function () {

            // BUKA MODAL saat klik input Kode
            $("#kode").on("click", function () {
                let html = "";
                items.forEach(item => {
                    html += `<tr>
                        <td>${item.kode}</td>
                        <td>${item.nama}</td>
                        <td>${item.harga}</td>
                        <td>
                            <button class="btn btn-success pilih"
                                data-kode="${item.kode}"
                                data-nama="${item.nama}"
                                data-satuan="${item.satuan}"
                                data-harga="${item.harga}">
                                Pilih
                            </button>
                        </td>
                    </tr>`;
                });
                $("#listItem").html(html);
                new bootstrap.Modal(document.getElementById('modalItem')).show();
            });

            // PILIH ITEM dari modal
            $("#listItem").on("click", ".pilih", function () {
                $("#kode").val($(this).data("kode"));
                $("#nama").val($(this).data("nama"));
                $("#satuan").val($(this).data("satuan"));
                $("#harga").val($(this).data("harga"));
                $("#qty").val("").focus();
                $("#subtotal_preview").val("");
                $("#modalItem").modal("hide");
            });

            // Update subtotal preview saat qty diketik
            $("#qty").on("input", function () {
                updateSubtotalPreview();
            });

            // TAMBAH KE TABEL
            $("#tambah").on("click", function () {
                let kode    = $("#kode").val().trim();
                let nama    = $("#nama").val().trim();
                let satuan  = $("#satuan").val().trim();
                let harga   = parseFloat($("#harga").val()) || 0;
                let qty     = parseInt($("#qty").val()) || 0;

                if (kode === "") { alert("Pilih item dulu!"); return; }
                if (qty <= 0)   { alert("Isi Qty terlebih dahulu!"); return; }

                let subtotal = harga * qty;

                let row = `<tr>
                    <td><button class="btn btn-danger hapus">X</button></td>
                    <td>${kode}</td>
                    <td>${nama}</td>
                    <td>${satuan}</td>
                    <td class="harga">${harga}</td>
                    <td class="qty">${qty}</td>
                    <td class="subtotal">${subtotal}</td>
                </tr>`;

                $("#tbldata tbody").append(row);
                hitungtotal();

                // reset input row
                $("#kode, #nama, #satuan, #harga, #qty, #subtotal_preview").val("");
            });

            // HAPUS baris
            $("#tbldata").on("click", ".hapus", function () {
                $(this).closest("tr").remove();
                hitungtotal();
            });

            // Diskon % berubah
            $("#diskon_persen").on("input", function () {
                hitungtotal();
            });

            // Bayar berubah
            $("#bayar").on("input", function () {
                hitungtotal();
            });

        });

    </script>

</body>

</html>
