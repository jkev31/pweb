<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mini POS</title>
    <!-- STEP 1: SETUP (DONE) -->
    <!-- Bootstrap & jQuery sudah disediakan -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css
" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">



    <div class="container mt-5 flex-grow-1">
        <h2 class="mb-4 text-center"> Mini POS (Frontend Only)</h2>
        <!-- ================= STEP 3: MASTER ITEM ================= -->
        <!-- STATUS: DONE -->
        <div class="card mb-4">
            <div class="card-header text-center bg-success text-white">Master Item</div>
            <div class="card-body">
                <table class="table table-bordered text-center" id="tableItem">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Barang</th>
                            <th>Harga</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- STEP 3: tampilkan data dari JS -->
                    </tbody>
                </table>
            </div>
        </div>



        <!-- ================= STEP 4: LAYOUT TRANSAKSI ================= -->
        <!-- STATUS: DONE -->
        <div class="card">
            <div class="card-header text-center bg-success text-white">Transaksi Penjualan</div>
            <div class="card-body">
                <table class="table table-bordered text-center" id="tableTransaksi">
                    <thead>
                        <tr>
                            <th>Barang</th>
                            <th>Qty</th>
                            <th>Harga</th>
                            <th>Subtotal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- STEP 6: baris transaksi muncul di sini -->
                    </tbody>
                </table>
                <!-- STEP 6: tombol tambah -->
                <!-- STATUS: DONE -->
                <button class="btn btn-primary mb-3" id="btnTambah">+ Tambah
                    Item</button>
                <!-- STEP 10: total -->
                <!-- STATUS: DONE -->
                <h5>Total: Rp <span id="total">0</span></h5>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 mt-5 bg-dark text-white">
        Source: Best of the Best GPT
    </footer>


    <script>
        // ================= STEP 2: DATA MASTER =================
        // STATUS: DONE
        let items = [
            { id: 1, nama: "Pensil", harga: 2000 },
            { id: 2, nama: "Buku", harga: 5000 },
            { id: 3, nama: "Penghapus", harga: 1500 }
        ];
        // ================= STEP 3: LOAD MASTER ITEM =================
        // STATUS: DONE
        function loadItems() {
            let html = "";
            items.forEach((item, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.nama}</td>
                        <td>${item.harga}</td>
                    </tr>
                `;
            });
            $("#tableItem tbody").html(html);
        }
        // ================= STEP 5: DROPDOWN =================
        // STATUS: DONE
        function generateOptions() {
            let opt = `<option value="">-- Pilih Barang --</option>`;
            items.forEach(item => {
                opt += `<option value="${item.id}">${item.nama}</option>`;
            });
            return opt;
        }
        // ================= STEP 6: TAMBAH BARIS =================
        // STATUS: DONE
        $("#btnTambah").click(function () {
            let row = `
                <tr>
                    <td>
                        <select class="form-control barang">
                            ${generateOptions()}
                        </select>
                    </td>
                    <td>
                        <input type="number" class="form-control qty" min="1" disabled>
                    </td>
                    <td>
                        <input type="text" class="form-control harga" readonly>
                    </td>
                    <td>
                        <input type="text" class="form-control subtotal" readonly>
                    </td>
                    <td>
                        <button class="btn btn-danger btn-sm hapus">X</button>
                    </td>
                </tr>
            `;
            $("#tableTransaksi tbody").append(row);
        });
        // ================= STEP 7: HAPUS BARIS =================
        // STATUS: DONE
        $(document).on("click", ".hapus", function () {
            $(this).closest("tr").remove();
            hitungTotal();
        });


        // ================= STEP 8: AUTO ISI HARGA =================
        // STATUS: TODO
        $(document).on("change", ".barang", function () {
            let id = $(this).val();
            let item = items.find(i => i.id == id);
            let row = $(this).closest("tr");
            // TODO:
            // 1. isi harga ke input .harga
            // 2. reset qty
            // 3. reset subtotal

            if (item) {
                row.find(".harga").val(item.harga);
                row.find(".qty").prop("disabled", false).val("");
                row.find(".subtotal").val("");
            } else {
                row.find(".harga").val("");
                row.find(".qty").prop("disabled", true).val("");
                row.find(".subtotal").val("");
            }
        });
        // ================= STEP 9: HITUNG SUBTOTAL =================
        // STATUS: TODO
        $(document).on("input", ".qty", function () {
            let row = $(this).closest("tr");
            let qty = row.find(".qty").val();
            let harga = row.find(".harga").val();
            // TODO:
            // 1. hitung subtotal = qty * harga
            // 2. tampilkan ke input .subtotal
            if (qty <= 0 || isNaN(qty)) {
                row.find(".subtotal").val("");
                hitungTotal();
                return;
            }

            let subtotal = qty * harga;
            row.find(".subtotal").val(subtotal);

            hitungTotal();
        });
        // ================= STEP 10: HITUNG TOTAL =================
        // STATUS: DONE
        function hitungTotal() {
            let total = 0;
            $(".subtotal").each(function () {
                total += parseInt($(this).val()) || 0;
            });
            $("#total").text(total);
        }
        // ================= INIT =================
        // STATUS: DONE
        $(document).ready(function () {
            loadItems();
        });
    </script>
</body>

</html>
